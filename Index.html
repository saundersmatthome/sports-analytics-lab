<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>Sports Analytics Lab 0.01.003</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf0fb;background:#0b1220}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:18px 22px;border-bottom:1px solid #28354b;display:flex;justify-content:space-between;align-items:center}.layout{display:flex;min-height:calc(100vh - 70px)}aside{width:210px;padding:18px;border-right:1px solid #28354b;flex-shrink:0}main{flex:1;padding:22px;min-width:0}.nav{display:flex;flex-direction:column;gap:8px}.nav button,.sports button{border:0;background:#182439;color:#dce7fa;padding:11px 14px;border-radius:9px;text-align:left}.nav button.active,.sports button.active{background:#2869d9;color:white}.sports{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 22px}.card,.panel{background:#151f31;border:1px solid #2a3b54;border-radius:14px;padding:17px}.card small{color:#a8b8cf}.card strong{display:block;font-size:24px;margin-top:7px}.panel{margin-bottom:16px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 14px}p,small{color:#afbed4}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;text-align:left;border-bottom:1px solid #304058}th{font-size:12px;color:#b1c1d7}td{font-size:14px}.positive{color:#5de49a}.negative{color:#ff8a8a}.muted{color:#aabbd2}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}input,select{background:#0e1829;color:white;border:1px solid #435574;border-radius:8px;padding:10px;max-width:100%}.primary{background:#2869d9;color:white;border:0;border-radius:8px;padding:11px 16px}.secondary{background:#26344b;color:white;border:0;border-radius:8px;padding:11px 16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pill{display:inline-block;border:1px solid #3a5378;border-radius:16px;padding:4px 8px;font-size:12px}.scroll{overflow-x:auto}.note{font-size:12px;color:#a9b8cb}.tabbar{display:none}label{display:block;color:#bbcae0;font-size:13px;margin-bottom:6px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}.formgrid input,.formgrid select{width:100%}.leg{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2a3b54;gap:8px}.leg label{margin:0;color:#eaf0fb}.warning{border-left:3px solid #d3a34d;padding-left:12px}@media(max-width:850px){aside{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.tabbar{display:flex;position:sticky;bottom:0;background:#101c30;border-top:1px solid #35435b;justify-content:space-around;padding:8px 2px}.tabbar button{border:0;background:none;color:#dbe7fb;font-size:12px;padding:8px}.layout{min-height:0}main{padding:15px}.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.cards{gap:8px}.card{padding:12px}.card strong{font-size:20px}.formgrid{grid-template-columns:1fr}header{padding:14px}}
</style></head><body><header><div><b>🏟️ Sports Analytics Lab</b> <span class="pill">v0.01.003</span></div><small>Paper only · Demo markets</small></header><div class="layout"><aside><h2>Navigation</h2><div id="nav" class="nav"></div><hr style="border-color:#2a3b54;margin:25px 0"><small>All figures are illustrative until a verified feed is connected.</small></aside><main><div id="sports" class="sports"></div><div id="content"></div></main></div><div id="tabbar" class="tabbar"></div><script>
const SPORTS=['All Sports','NFL','NBA','MLB','NHL'],VIEWS=['Dashboard','Games & Odds','Live Scores','Predictions','Kalshi','Parlays','Paper Bets','Performance','Settings'];const KEY='sports-lab-v001002'; // preserve existing local browser ledger
const demo=[{id:1,sport:'NFL',home:'Dallas Cowboys',away:'Philadelphia Eagles',date:'Demo fixture',odds:115,models:[52,54,57,53],kalshi:0.55},{id:2,sport:'NFL',home:'Detroit Lions',away:'Chicago Bears',date:'Demo fixture',odds:-125,models:[58,60,62,59],kalshi:0.58},{id:3,sport:'NBA',home:'Boston Celtics',away:'Miami Heat',date:'Demo fixture',odds:-110,models:[55,58,56,57],kalshi:0.56},{id:4,sport:'NBA',home:'Dallas Mavericks',away:'Phoenix Suns',date:'Demo fixture',odds:130,models:[47,49,52,48],kalshi:0.48},{id:5,sport:'MLB',home:'LA Dodgers',away:'NY Yankees',date:'Demo fixture',odds:-145,models:[59,61,60,62],kalshi:0.60},{id:6,sport:'MLB',home:'Texas Rangers',away:'Houston Astros',date:'Demo fixture',odds:125,models:[48,50,51,49],kalshi:0.49},{id:7,sport:'NHL',home:'Dallas Stars',away:'Colorado Avalanche',date:'Demo fixture',odds:120,models:[49,52,51,50],kalshi:0.50},{id:8,sport:'NHL',home:'Boston Bruins',away:'NY Rangers',date:'Demo fixture',odds:-105,models:[53,54,55,52],kalshi:0.53}];
let saved;try{saved=JSON.parse(localStorage.getItem(KEY))}catch{};let state={sport:'All Sports',view:'Dashboard',bankroll:10000,bets:[],selected:[1,3],stake:25,...saved};const $=id=>document.getElementById(id);const money=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const dec=o=>o>0?1+o/100:1+100/Math.abs(o);const ensemble=g=>g.models.reduce((a,b)=>a+b,0)/g.models.length/100;const ev=g=>ensemble(g)*dec(g.odds)-1;const filtered=()=>demo.filter(g=>state.sport==='All Sports'||g.sport===state.sport);const persist=()=>localStorage.setItem(KEY,JSON.stringify(state));const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setView(v){state.view=v;persist();render()}function setSport(s){state.sport=s;persist();render()}
function render(){ $('nav').innerHTML=VIEWS.map(v=>`<button class="${state.view===v?'active':''}" data-view="${v}">${v}</button>`).join('');$('tabbar').innerHTML=['Dashboard','Live Scores','Parlays','Paper Bets','Performance'].map(v=>`<button data-view="${v}">${v.replace(' & Odds','')}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('sports').innerHTML=SPORTS.map(s=>`<button class="${state.sport===s?'active':''}" data-sport="${s}">${s}</button>`).join('');document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>setSport(b.dataset.sport));const views={'Dashboard':dashboard,'Games & Odds':games,'Live Scores':liveScores,'Predictions':predictions,'Kalshi':kalshi,'Parlays':parlays,'Paper Bets':bets,'Performance':performance,'Settings':settings};$('content').innerHTML=views[state.view]();bind()}
function cards(){const settled=state.bets.filter(b=>b.status!=='open'),wins=settled.filter(b=>b.status==='win').length,profit=state.bankroll-10000;return `<div class="cards"><div class="card"><small>Virtual bankroll</small><strong>${money(state.bankroll)}</strong></div><div class="card"><small>Net P/L</small><strong class="${profit>=0?'positive':'negative'}">${money(profit)}</strong></div><div class="card"><small>Win / loss</small><strong>${wins} / ${settled.length-wins}</strong></div><div class="card"><small>Open wagers</small><strong>${state.bets.filter(b=>b.status==='open').length}</strong></div></div>`}
function gameTable(){return `<div class="panel scroll"><h2>Game comparison</h2><table><thead><tr><th>League</th><th>Home selection</th><th>American odds</th><th>Ensemble</th><th>Kalshi indicative</th><th>Model EV</th></tr></thead><tbody>${filtered().map(g=>`<tr><td>${g.sport}</td><td>${g.home} vs ${g.away}<br><small>${g.date}</small></td><td>${g.odds>0?'+':''}${g.odds}</td><td>${(ensemble(g)*100).toFixed(1)}%</td><td>${(g.kalshi*100).toFixed(1)}%</td><td class="${ev(g)>=0?'positive':'negative'}">${(ev(g)*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>`}
function dashboard(){return `<h1>Dashboard</h1>${cards()}${gameTable()}<p class="note warning">Demo betting mode: fixtures, odds, Kalshi prices and model probabilities are synthetic, not current data. No prediction performance is claimed.</p>`}function games(){return `<h1>Games & Odds</h1><p>Live sportsbook data is displayed separately from the fictional demonstration wagers.</p>${realOdds()}${gameTable()}`}
const LIVE_LEAGUES={NFL:'football/nfl',NBA:'basketball/nba',MLB:'baseball/mlb',NHL:'hockey/nhl'};
let liveCache={},liveStatus='not_loaded',liveError='',liveUpdated='';
function liveScores(){
 const leagues=state.sport==='All Sports'?Object.keys(LIVE_LEAGUES):[state.sport];
 const items=leagues.flatMap(league=>(liveCache[league]||[]).map(event=>({...event,league})));
 const message=liveStatus==='loading'?'Fetching scoreboards…':liveStatus==='error'?'Could not reach the scoreboard service. '+safe(liveError):liveStatus==='loaded'?'Latest response: '+safe(liveUpdated)+'. Scores may be delayed.':'Choose Refresh live scores to request real games.';
 return `<h1>Live Scores & Schedules</h1><p>Read-only scoreboard feed. These games are actual provider records when loaded, and are <b>not linked to demo wagers or model predictions</b>.</p><div class="panel"><div class="actions"><button id="refreshScores" class="primary" ${liveStatus==='loading'?'disabled':''}>Refresh live scores</button><span class="muted">${message}</span></div><p class="note">Uses ESPN's publicly accessible scoreboard endpoints on a best-effort basis. Availability, browser access, accuracy, and continued free access are not guaranteed. No API key required.</p></div><div class="panel scroll"><h2>Scoreboard ${items.length?'('+items.length+' games)':''}</h2>${items.length?`<table><tr><th>League</th><th>Start (local)</th><th>Matchup</th><th>Score</th><th>Status</th></tr>${items.map(e=>`<tr><td>${safe(e.league)}</td><td>${safe(e.date)}</td><td>${safe(e.away)} @ ${safe(e.home)}</td><td>${safe(e.awayScore)} – ${safe(e.homeScore)}</td><td>${safe(e.status)}</td></tr>`).join('')}</table>`:'<p>No games loaded for this selection. A valid response may contain no games on the requested day.</p>'}</div>`;
}
async function fetchScores(){
 liveStatus='loading';liveError='';render();
 const leagues=state.sport==='All Sports'?Object.keys(LIVE_LEAGUES):[state.sport];
 const results=await Promise.allSettled(leagues.map(async league=>{
  const url='https://site.api.espn.com/apis/site/v2/sports/'+LIVE_LEAGUES[league]+'/scoreboard?dates='+new Date().toISOString().slice(0,10).replace(/-/g,'');
  const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();if(!Array.isArray(data.events))throw Error('Unexpected feed format');
  return {league,events:data.events.map(e=>{
   const comp=e.competitions?.[0]||{}, competitors=comp.competitors||[];
   const home=competitors.find(c=>c.homeAway==='home')||{},away=competitors.find(c=>c.homeAway==='away')||{};
   return {date:e.date?new Date(e.date).toLocaleString():'—',home:home.team?.displayName||'TBD',away:away.team?.displayName||'TBD',homeScore:home.score??'—',awayScore:away.score??'—',status:e.status?.type?.description||'Unknown'};
  })};
 }));
 let failures=[];results.forEach((r,i)=>{if(r.status==='fulfilled')liveCache[r.value.league]=r.value.events;else failures.push(leagues[i]+': '+String(r.reason?.message||r.reason))});
 liveStatus=failures.length===leagues.length?'error':'loaded';liveError=failures.join('; ');liveUpdated=new Date().toLocaleString();render();
}
const MARKET_SPORTS={NFL:'americanfootball_nfl',NBA:'basketball_nba',MLB:'baseball_mlb',NHL:'icehockey_nhl'};
let oddsData=[],oddsStatus='Not requested',oddsAt='',kalshiData=[],kalshiStatus='Not requested',kalshiAt='',eloData=[],eloStatus='Not calculated',eloAt='';
const pct=x=>Number.isFinite(x)?(100*x).toFixed(1)+'%':'—';
function realOdds(){return `<div class="panel scroll"><h2>Real sportsbook prices (read-only)</h2><p>Requires your own free-tier The Odds API key. Requests run directly in your browser; do not use a sensitive or paid key. Availability, quotas and cross-origin access vary. These are NOT linked to demo betting tickets.</p><div class="actions"><input id="oddsKey" type="password" placeholder="The Odds API key (session only)" autocomplete="off"><button class="primary" id="fetchOdds">Fetch sportsbook odds</button></div><p class="note">${safe(oddsStatus)} ${safe(oddsAt)}</p><table><tr><th>League</th><th>Game / start</th><th>Bookmaker</th><th>Home</th><th>Away</th></tr>${oddsData.map(o=>`<tr><td>${safe(o.sport)}</td><td>${safe(o.away)} @ ${safe(o.home)}<br><small>${safe(o.time)}</small></td><td>${safe(o.book)}</td><td>${safe(o.homePrice)}</td><td>${safe(o.awayPrice)}</td></tr>`).join('')}</table>${!oddsData.length?'<p>No odds loaded.</p>':''}</div>`}
async function fetchOdds(){const key=$('oddsKey')?.value.trim();if(!key)return alert('Enter your own API key.');oddsStatus='Loading…';oddsData=[];render();const leagues=state.sport==='All Sports'?Object.keys(MARKET_SPORTS):[state.sport];const r=await Promise.allSettled(leagues.map(async sport=>{const u='https://api.the-odds-api.com/v4/sports/'+MARKET_SPORTS[sport]+'/odds/?apiKey='+encodeURIComponent(key)+'&regions=us&markets=h2h&oddsFormat=american';const res=await fetch(u);if(!res.ok)throw Error(sport+' HTTP '+res.status);const json=await res.json();return json.slice(0,30).map(e=>{const m=e.bookmakers?.[0],h=m?.markets?.find(m=>m.key==='h2h'),out=h?.outcomes||[];return {sport,home:e.home_team,away:e.away_team,time:e.commence_time?new Date(e.commence_time).toLocaleString():'—',book:m?.title||'—',homePrice:out.find(x=>x.name===e.home_team)?.price??'—',awayPrice:out.find(x=>x.name===e.away_team)?.price??'—'}}) }));const errors=[];r.forEach((v,i)=>v.status==='fulfilled'?oddsData.push(...v.value):errors.push(leagues[i]+': '+(v.reason?.message||'request failed')));oddsStatus=errors.length?'Partial/error: '+errors.join('; '):'Loaded from The Odds API';oddsAt=new Date().toLocaleString();render()}
function kalshi(){return `<h1>Kalshi Market Explorer</h1><p>Public, read-only Kalshi market records. No trading. Results are not automatically matched to sportsbook fixtures; a contract's exact settlement rules must be checked before comparing prices.</p><div class="panel"><div class="actions"><button id="fetchKalshi" class="primary">Request public Kalshi markets</button><span class="muted">${safe(kalshiStatus)} ${safe(kalshiAt)}</span></div><p class="note">Best-effort public API. Direct local-file browser requests may be blocked by CORS. No proxy or API credentials are used.</p></div><div class="panel scroll"><table><tr><th>Market</th><th>Ticker</th><th>Yes bid</th><th>Yes ask</th><th>Volume</th></tr>${kalshiData.map(m=>`<tr><td>${safe(m.title)}</td><td>${safe(m.ticker)}</td><td>${safe(m.bid)}</td><td>${safe(m.ask)}</td><td>${safe(m.volume)}</td></tr>`).join('')}</table>${!kalshiData.length?'<p>No markets loaded. The sample Kalshi column on the Dashboard remains fictional.</p>':''}</div>`}
async function fetchKalshi(){kalshiStatus='Loading…';render();try{const r=await fetch('https://api.elections.kalshi.com/trade-api/v2/markets?limit=200&status=open',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.markets))throw Error('Unexpected response');const words=/football|basketball|baseball|hockey|nfl|nba|mlb|nhl|super bowl|world series|stanley cup/i;kalshiData=d.markets.filter(m=>words.test([m.title,m.subtitle,m.ticker].join(' '))).slice(0,35).map(m=>({title:m.title||m.subtitle||'Untitled',ticker:m.ticker||'—',bid:m.yes_bid_dollars??(Number.isFinite(m.yes_bid)?'$'+(m.yes_bid/100).toFixed(2):'—'),ask:m.yes_ask_dollars??(Number.isFinite(m.yes_ask)?'$'+(m.yes_ask/100).toFixed(2):'—'),volume:m.volume??'—'}));kalshiStatus=kalshiData.length?'Loaded (first 200 open markets searched)':'No matching sports markets in first 200 open markets';}catch(e){kalshiStatus='Unable to load: '+e.message}kalshiAt=new Date().toLocaleString();render()}
function predictions(){return `<h1>Predictions</h1><div class="panel"><h2>Experimental Elo model · calculated from completed games</h2><p>Start every team at 1500, process up to the previous 14 days of final scores, apply a 55-point home advantage and K=20. These are unvalidated short-history estimates, not trained or backtested forecasts.</p><button id="calculateElo" class="primary">Calculate Elo from recent games</button><p class="note">${safe(eloStatus)} ${safe(eloAt)}</p></div><div class="panel scroll"><table><tr><th>League</th><th>Upcoming matchup</th><th>Home Elo</th><th>Away Elo</th><th>Home win estimate</th></tr>${eloData.map(x=>`<tr><td>${safe(x.sport)}</td><td>${safe(x.away)} @ ${safe(x.home)}</td><td>${x.hr.toFixed(0)}</td><td>${x.ar.toFixed(0)}</td><td>${pct(x.p)}</td></tr>`).join('')}</table>${!eloData.length?'<p>Calculate Elo to see estimates when upcoming games are available.</p>':''}</div><div class="panel"><h2>Other model concepts</h2><p>Regression, gradient boosting, Bayesian, and ensemble outputs remain demo-only; no model accuracy is claimed.</p></div>`}
async function calculateElo(){eloStatus='Calculating…';eloData=[];render();const leagues=state.sport==='All Sports'?Object.keys(LIVE_LEAGUES):[state.sport];const failures=[];for(const sport of leagues){try{const days=[];for(let offset=14;offset>=0;offset--){const d=new Date();d.setUTCDate(d.getUTCDate()-offset);days.push(d.toISOString().slice(0,10).replace(/-/g,''))}const results=await Promise.all(days.map(async date=>{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/'+LIVE_LEAGUES[sport]+'/scoreboard?dates='+date);if(!r.ok)throw Error('HTTP '+r.status);return (await r.json()).events||[]}));const ratings=new Map(),upcoming=[];const rating=id=>ratings.get(id)||1500;const seen=new Set();for(const events of results){for(const e of events){if(seen.has(e.id))continue;seen.add(e.id);const c=e.competitions?.[0]?.competitors||[],h=c.find(x=>x.homeAway==='home'),a=c.find(x=>x.homeAway==='away');if(!h?.team?.id||!a?.team?.id)continue;const hi=h.team.id,ai=a.team.id,hr=rating(hi),ar=rating(ai);const probability=1/(1+Math.pow(10,(ar-hr-55)/400));if(e.status?.type?.completed){const hs=Number(h.score),as=Number(a.score);if(!Number.isFinite(hs)||!Number.isFinite(as))continue;const actual=hs===as?.5:hs>as?1:0;const change=20*(actual-probability);ratings.set(hi,hr+change);ratings.set(ai,ar-change)}else if(new Date(e.date).getTime()>=Date.now()-86400000){upcoming.push({sport,home:h.team.displayName,away:a.team.displayName,hi,ai})}}}eloData.push(...upcoming.map(e=>({...e,hr:rating(e.hi),ar:rating(e.ai),p:1/(1+Math.pow(10,(rating(e.ai)-rating(e.hi)-55)/400))})).slice(0,25));}catch(e){failures.push(sport+': '+e.message)}}eloStatus=failures.length?'Partial/error: '+failures.join('; '):'Calculated using recent completed ESPN games';eloAt=new Date().toLocaleString();render()}
function parlays(){const all=filtered();const sel=demo.filter(g=>state.selected.includes(g.id));const d=sel.reduce((a,g)=>a*dec(g.odds),1),p=sel.reduce((a,g)=>a*ensemble(g),1),s=Number(state.stake)||0;return `<h1>Parlay Builder</h1><p>Combine 2–6 selections from different games. Independence assumption is for demonstration only.</p><div class="grid2"><div class="panel"><h2>Select legs</h2>${all.map(g=>`<div class="leg"><label><input type="checkbox" data-leg="${g.id}" ${state.selected.includes(g.id)?'checked':''}> ${g.sport}: ${g.home}</label><span>${g.odds>0?'+':''}${g.odds}</span></div>`).join('')}</div><div class="panel"><h2>Paper parlay ticket</h2><label>Stake ($)</label><input id="stake" type="number" min="0.01" step="0.01" value="${safe(state.stake)}"><p>Selected legs: <b>${sel.length}</b></p><p>Combined decimal odds: <b>${d.toFixed(3)}x</b></p><p>Theoretical joint probability: <b>${(p*100).toFixed(2)}%</b></p><p>Potential net profit: <b>${money(s*(d-1))}</b></p><p>Expected profit: <b class="${p*d-1>=0?'positive':'negative'}">${money(s*(p*d-1))}</b></p><button class="primary" id="placeParlay" ${sel.length<2||sel.length>6||s<=0||s>state.bankroll?'disabled':''}>Place simulated parlay</button><p class="note">No real bets. No live odds. Correlation is not modeled.</p></div></div>`}
function bets(){return `<h1>Paper Betting</h1>${cards()}<div class="panel"><h2>Single-game wager</h2><div class="formgrid"><div><label>Selection</label><select id="singleGame">${filtered().map(g=>`<option value="${g.id}">${g.sport} · ${g.home}</option>`).join('')}</select></div><div><label>Stake ($)</label><input type="number" id="singleStake" min="0.01" step="0.01" value="25"></div><div style="align-self:end"><button class="primary" id="placeSingle">Place paper bet</button></div></div></div>${betTable()}`}
function betTable(){return `<div class="panel scroll"><h2>Wager ledger</h2><table><tr><th>Ticket</th><th>Stake</th><th>Odds</th><th>Status</th><th>Action</th></tr>${state.bets.map(b=>`<tr><td>${safe(b.label)}<br><small>${new Date(b.created).toLocaleString()}</small></td><td>${money(b.stake)}</td><td>${b.decimal.toFixed(3)}x</td><td>${b.status}</td><td>${b.status==='open'?`<button class="secondary" data-settle="${b.id}" data-result="win">Win</button> <button class="secondary" data-settle="${b.id}" data-result="loss">Loss</button> <button class="secondary" data-settle="${b.id}" data-result="void">Void</button>`:''}</td></tr>`).join('')}</table><p class="note">Manual settlement in v0.01.003. Winning tickets return stake plus profit; void tickets return stake. Actions are irreversible in this prototype.</p></div>`}
function performance(){const settled=state.bets.filter(b=>['win','loss'].includes(b.status)),staked=settled.reduce((a,b)=>a+b.stake,0),returns=settled.reduce((a,b)=>a+(b.status==='win'?b.stake*b.decimal:0),0);return `<h1>Performance</h1>${cards()}<div class="panel"><h2>Results</h2><p>Settled bets: <b>${settled.length}</b></p><p>Win rate: <b>${settled.length?(100*settled.filter(b=>b.status==='win').length/settled.length).toFixed(1):'—'}%</b></p><p>Settled ROI: <b>${staked?(100*(returns-staked)/staked).toFixed(2)+'%':'—'}</b></p><p>Staked volume: <b>${money(staked)}</b></p><p class="note">Model calibration and backtesting charts will become available after real historical predictions and outcomes are imported.</p></div>${betTable()}`}
function settings(){return `<h1>Settings</h1><div class="panel"><h2>Local demo data</h2><p>Your bankroll and paper wagers are stored in this browser only. Clearing browser storage deletes them. There is no account synchronization.</p><div class="actions"><button id="export" class="secondary">Export data (JSON)</button><button id="reset" class="secondary">Reset demo bankroll and wagers</button></div></div><div class="panel"><h2>Data integrations</h2><p>Sportsbook odds: On-demand, user-provided The Odds API key (best effort)</p><p>Kalshi: Public market explorer (best effort)</p><p>Elo: Experimental 14-day calculation, not validated</p><p>Live scores: On-demand read-only ESPN feed (best effort)<br>Cloud sync: Disabled</p></div>`}
function place(label,legs,stake){if(!(stake>0)||stake>state.bankroll)return alert('Invalid stake or insufficient virtual bankroll');const decimal=legs.reduce((a,g)=>a*dec(g.odds),1);state.bankroll=Math.round((state.bankroll-stake)*100)/100;state.bets.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2),label,legs:legs.map(g=>({gameId:g.id,odds:g.odds})),stake,decimal,status:'open',created:new Date().toISOString()});persist();render()}
function bind(){if($('refreshScores'))$('refreshScores').onclick=fetchScores;if($('fetchOdds'))$('fetchOdds').onclick=fetchOdds;if($('fetchKalshi'))$('fetchKalshi').onclick=fetchKalshi;if($('calculateElo'))$('calculateElo').onclick=calculateElo;document.querySelectorAll('[data-leg]').forEach(el=>el.onchange=()=>{const id=Number(el.dataset.leg);state.selected=el.checked?[...state.selected,id]:state.selected.filter(x=>x!==id);persist();render()});if($('stake'))$('stake').onchange=e=>{state.stake=e.target.value;persist();render()};if($('placeParlay'))$('placeParlay').onclick=()=>{const legs=demo.filter(g=>state.selected.includes(g.id));if(legs.length<2||legs.length>6)return;place('Parlay: '+legs.map(g=>g.home).join(' + '),legs,Number(state.stake))};if($('placeSingle'))$('placeSingle').onclick=()=>{const g=demo.find(g=>g.id===Number($('singleGame').value));place('Single: '+g.home,[g],Number($('singleStake').value))};document.querySelectorAll('[data-settle]').forEach(el=>el.onclick=()=>{const b=state.bets.find(b=>b.id===el.dataset.settle);if(!b||b.status!=='open')return;const result=el.dataset.result;if(!confirm('Mark this ticket as '+result+'?'))return;b.status=result;if(result==='win')state.bankroll+=b.stake*b.decimal;if(result==='void')state.bankroll+=b.stake;state.bankroll=Math.round(state.bankroll*100)/100;persist();render()});if($('export'))$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:'0.01.003',exported:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sports-lab-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('reset'))$('reset').onclick=()=>{if(confirm('Erase all local demo wagers and reset bankroll to $10,000?')){state.bankroll=10000;state.bets=[];persist();render()}}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
